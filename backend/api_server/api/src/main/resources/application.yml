spring:
  application:
    name: api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  neo4j:
    uri: ${NEO4J_URI}
    dbname: ${NEO4J_DB}
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD}

  elasticsearch:
    uris: ${ELASTIC_URL}

  clickhouse:
    url: ${CLICKHOUSE_URL}
    database: ${CLICKHOUSE_DATABASE}
    username: ${CLICKHOUSE_USERNAME}
    password: ${CLICKHOUSE_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
server:
  port: 8082

keycloak:
  url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
        cancelRunningFuture: true

    instances:
      Neo4jGraph:
        baseConfig: default
      ElasticIndex:
        baseConfig: default
      PostgresArticle:
        baseConfig: default

  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

    instances:
      Neo4jGraph:
        baseConfig: default
      ElasticIndex:
        baseConfig: default
      PostgresArticle:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: analytics-api
    distribution:
      percentiles-histogram:
        http.server.requests: true